name: Check the plugin list

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    name: community-plugins.json matches the plugin repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
